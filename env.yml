name: infomorphic_env
channels:
  - conda-forge
dependencies:
  - fastprogress
  - matplotlib
  - pytables
  - scikit-learn
  - optuna=2.10
  - seaborn
  - hydra-core=1.2
  - tqdm
  - optuna-dashboard=0.12
  - cudatoolkit=10.2
  - torchaudio
  - h5py
  - ipywidgets
  - sqlalchemy=1.4
  - ipykernel
  - pytorch
  - fastcluster
  - torchvision
  - autograd
  - cvxopt
  - numexpr
  - imageio
  - plotly
  - nbformat
  - oct2py
  - colorcet
  - pip
  - pip:
    - git+https://github.com/Abzinger/SxPID.git
    - hydra-optuna-sweeper==1.2
    - hydra-ray-launcher==1.2.1
    - hydra-joblib-launcher
